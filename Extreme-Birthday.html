NALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,tK={key:!0,ref:!0,__self:!0,__source:!0};function Ks(e,t,n){var o,r={},l=null,i=null;n!==void 0&&(l=""+n),t.key!==void 0&&(l=""+t.key),t.ref!==void 0&&(i=t.ref);for(o in t)$f.call(t,o)&&!tK.hasOwnProperty(o)&&(r[o]=t[o]);if(e&&e.defaultProps)for(o in t=e.defaultProps,t)r[o]===void 0&&(r[o]=t[o]);return{$$typeof:_f,type:e,key:l,ref:i,props:r,_owner:eK.current}}var U=Ks,f=Ks;var L={HER_NAME:"Jolly Kamikazi",NICKNAME:"Jolly Kamikazi",SHORT:"Jolly",COLORS:{bg:"#09050F",pink:"#FF2E93",purple:"#9D4DFF",lilac:"#D9B8FF"},REASONS:[{front:"01",back:"The way you laugh like the whole world should pause to hear it."},{front:"02",back:"Your face. Unfair levels of pretty. Every single day."},{front:"03",back:"How you make boring days feel like main-character energy."},{front:"04",back:"That stare when you're thinking. God took time on you, Jolly."},{front:"05",back:"You remember the tiniest things I say. You actually listen."},{front:"06",back:"You challenge me, you don't just agree to be cute."},{front:"07",back:"Your kindness - even when people don't deserve it."},{front:"08",back:"You believe in me when my own code won't compile."},{front:"09",back:"Being with you feels like coming home, but better."},{front:"10",back:"You being YOU. No filter. That's the rarest thing in this world."}],MEMORIES:[{date:"Oct 2023",title:"The day we met",desc:"10 seconds and my whole year rewired. You walked in like you owned the room.",icon:"✧",img:null},{date:"Nov 2023",title:"First time I saw YOU",desc:"That look. I knew. I just knew you were different. Captured it forever.",icon:"♡",img:"A"},{date:"Jan 2024",title:"Soft chaos era",desc:"Laughing in that car, bad directions, perfect memory. You made it magic.",icon:"☾",img:null},{date:"Apr 2024",title:"That golden hour",desc:"Sun on your skin, your smile brighter than the light. My favorite photo lives here.",icon:"✶",img:"B"},{date:"Today",title:"Right now",desc:"Still choosing you, Jolly. Every day. On purpose. For a long, long time.",icon:"∞",img:null}],LETTER_TEXT:`My Jolly Kamikazi,

I didn't know how to make a card that felt big enough, so I made you a whole universe instead.

Happy birthday to the person who turned my ordinary life into something I actually want to screenshot every day. You're not just beautiful (though... obviously), you're the kind of person who makes people better without even trying.

I love how you get excited about little things. I love how you go quiet when something really matters to you. I love that you push me, but you also let me be soft. That's rare. That's you.

I know I code too much, overthink too much, and say "one more commit" way too much. Thank you for being the one notification I never put on silent.

This year, I want more of us. More stupid laughs at 2am, more plans that change last minute, more you being unreal and me being grateful I get to call you mine.

You're 1000x more than I deserve and exactly what I prayed for before I knew what to pray for.

Always yours,
— Dalin`},nK=`
<div class="space-y-6 leading-[1.85] text-[16px] md:text-[18px]">
<p class="text-[22px] md:text-[26px] serif">Dear My Jolly Kamikazi, My Queen, My Whole Personality \uD83D\uDC51\uD83D\uDC96</p>

<p>OMG HI BESTIE \uD83D\uDE2D\uD83D\uDC95 — okay first of all, happy birthday to THE baddest, THE prettiest, THE softest human alive!!! \uD83E\uDD79\uD83D\uDC96✨ Like Jolly, are you even real??? \uD83D\uDE0D\uD83D\uDC98 Be honest — did God just go into creative mode and say “lemme cook” when He made you? Because GIRL, YOU ARE COOKED TO PERFECTION!!! \uD83D\uDD25\uD83E\uDD70\uD83D\uDC9D\uD83C\uDF39</p>

<p>I’m writing this at 3:17am btw \uD83D\uDCBB\uD83D\uDE05, because sleep is fake when you’re in love with someone who makes even air feel romantic \uD83E\uDEF6\uD83D\uDC93. Every time you text me “are you awake?” at 2am — YES I AM ALWAYS AWAKE FOR YOU \uD83D\uDE2D\uD83D\uDC97\uD83D\uDC97. You could text me “Dalin, come to Narnia” and I’d be like “on my way, let me grab my hoodie you stole” \uD83E\uDDE5\uD83D\uDC95\uD83E\uDD23</p>

<p>Speaking of hoodies — JOLLY, MY HOODIES HAVE LEFT THE CHAT AND ENTERED YOUR CLOSET!!! \uD83D\uDE29\uD83D\uDC9E\uD83D\uDC98 I have like one left and it smells like you now, which is actually not a complaint, that’s a flex \uD83D\uDC85\uD83D\uDC96\uD83D\uDC96. You in my hoodie + your headphones \uD83C\uDFA7\uD83D\uDC9C + that sleepy face? That’s my favorite movie, no Netflix needed \uD83D\uDCFD️\uD83D\uDE0D✨</p>

<p>Your headphones era deserves its own museum btw \uD83C\uDFA7\uD83D\uDE2D\uD83D\uDC93 — you with those headphones on, vibing, ignoring the whole world but still looking at me like I’m the only notification that matters \uD83E\uDD7A\uD83D\uDC95\uD83D\uDC97 — Ehhh Jolly you kill me softly fr fr \uD83D\uDC98\uD83D\uDC98\uD83D\uDC98. And your poses in the car??? \uD83D\uDE97\uD83D\uDC96 Girl you turned my Toyota into a Vogue studio \uD83D\uDE2D\uD83D\uDC85\uD83D\uDC96\uD83D\uDCF8 Like “Jolly Kamikazi in a car window, golden hour, unreal skin, main-character energy” — THAT’S A HEADLINE \uD83D\uDCF0\uD83D\uDC96✨</p>

<p>\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96 JOLLY LET ME BE SERIOUS FOR A SEC \uD83D\uDC96\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96</p>

<p>You make me want to be better, you know? \uD83E\uDD79\uD83E\uDEF6\uD83D\uDC97 Like, before you I was just coding and overthinking and saying “one more commit” at 4am \uD83D\uDCBB\uD83D\uDE05. Now I’m coding but with your picture on my second monitor \uD83D\uDDA5️\uD83D\uDC95\uD83D\uDC69‍\uD83D\uDCBB And my code compiles better when you say “you got this” — that’s scientifically proven by Dalin Labs™ \uD83D\uDD2C\uD83D\uDC96\uD83D\uDE02</p>

<p>You remember the tiniest things I say, Jolly \uD83D\uDE2D\uD83D\uDC95\uD83D\uDC93 — like that one time I said I like how you scrunch your nose when you laugh \uD83E\uDD27\uD83D\uDC96 and now you do it on purpose to make me melt \uD83E\uDEE0\uD83D\uDC97\uD83D\uDC98. YOU ARE A MENACE!!! A BEAUTIFUL, SOFT, PINK LIPGLOSS MENACE!!! \uD83D\uDC8B\uD83D\uDC96\uD83D\uDC84\uD83C\uDF38</p>

<p>Let me list some of my fav things that make you YOU, because 10 reasons are not enough — I need 1000!!! \uD83D\uDE24\uD83D\uDC96\uD83D\uDC96</p>

<p><span class="hl">1. Your laugh \uD83D\uDE02\uD83D\uDC96</span> — it sounds like the whole world should pause to hear it. That wheeze when something is REALLY funny? I live for that!!! \uD83D\uDE2D\uD83E\uDD23\uD83D\uDC95</p>
<p><span class="hl">2. Your stare ✨\uD83D\uDC40\uD83D\uDC9C</span> — when you’re thinking deep, biting your lip a little, God took extra time fr. I just stare back and forget my name \uD83D\uDE0D\uD83D\uDC98</p>
<p><span class="hl">3. How you steal fries AND my heart \uD83C\uDF5F\uD83D\uDC98</span> — “I’m not hungry” then eats my whole plate. Iconic. Robbery. I love being robbed by you \uD83D\uDE29\uD83D\uDC95\uD83E\uDD23</p>
<p><span class="hl">4. Your kindness \uD83E\uDD79\uD83E\uDEF6\uD83D\uDC97</span> — even when people don’t deserve it, you’re still soft. That’s real queen energy \uD83D\uDC51\uD83D\uDC96</p>
<p><span class="hl">5. Your chaos + softness combo \uD83D\uDC85\uD83E\uDD70\uD83D\uDC9E</span> — one minute you’re shouting “Dalin!!” the next you’re like “baby come here” — I HAVE WHIPLASH AND I LIKE IT \uD83D\uDE2D\uD83D\uDC93\uD83D\uDC93</p>
<p><span class="hl">6. How you hype me \uD83D\uDE24\uD83D\uDD25\uD83D\uDC96</span> — “my Dalin is the best coder” — Jolly I was debugging for 6 hours but your voice note fixed my soul \uD83D\uDCBB\uD83D\uDC95\uD83C\uDFA7</p>
<p><span class="hl">7. Your face. Just your face. Every. Single. Day. \uD83D\uDE0D\uD83D\uDC98\uD83D\uDC9D\uD83D\uDC8B</span> — unfair. illegal. should be arrested for being too pretty \uD83D\uDC6E‍♀️\uD83D\uDC96\uD83D\uDEA8</p>
<p><span class="hl">8. When you say “mwa” \uD83D\uDE18\uD83D\uDC8B\uD83D\uDC95</span> — bruh my heart does backflips, somersaults, parkour!!! \uD83E\uDD38‍♂️\uD83D\uDC96\uD83D\uDCA5</p>

<p>\uD83D\uDC9E\uD83D\uDC93\uD83D\uDC97 CRAZY EMOJI EXPLOSION FOR MY CRAZY GIRL \uD83D\uDC97\uD83D\uDC93\uD83D\uDC9E<br/>\uD83D\uDC96\uD83D\uDC95\uD83D\uDC98\uD83D\uDC9D\uD83D\uDC96\uD83D\uDC95\uD83D\uDC98\uD83D\uDC9D\uD83D\uDC96\uD83D\uDC95\uD83D\uDC98\uD83D\uDC9D\uD83D\uDC96\uD83D\uDC95\uD83D\uDC98\uD83D\uDC9D<br/>\uD83E\uDD70\uD83D\uDE0D\uD83E\uDD29\uD83D\uDE18\uD83D\uDE17\uD83D\uDE19\uD83D\uDE1A\uD83E\uDD17\uD83E\uDEF6✨\uD83C\uDF39\uD83D\uDC8B\uD83D\uDC84\uD83D\uDC51\uD83D\uDC85\uD83E\uDD8B\uD83C\uDF38\uD83C\uDF08\uD83C\uDF1F\uD83D\uDCAB</p>

<p>Jolly, you make boring days feel like main-character movies \uD83C\uDFAC\uD83D\uDC96✨. Remember that time we got lost because I said “I know a shortcut” and we ended up laughing for 40 minutes in the car? \uD83D\uDE97\uD83E\uDD23\uD83D\uDC95 That’s us. Always lost, always laughing, always choosing each other \uD83D\uDDFA️\uD83D\uDC96\uD83D\uDE02</p>

<p>And yo, real talk — you being YOU, no filter, no fake, just Jolly being Jolly Kamikazi with her 1000% heart \uD83D\uDC96\uD83D\uDC96\uD83D\uDC96 — that’s the rarest thing in this world \uD83C\uDF0D\uD83D\uDC8E✨. People fake vibes, you ARE the vibe. Periodt. \uD83D\uDC85\uD83D\uDC96\uD83D\uDD25</p>

<p>This year I want more of us, Jolly \uD83D\uDC96. More stupid laughs at 2am \uD83C\uDF19\uD83D\uDE02\uD83D\uDC95, more you stealing my hoodies and me pretending to be mad but secretly loving it \uD83E\uDDE5\uD83D\uDC98\uD83E\uDD2D, more plans that change last minute because we saw ice cream \uD83C\uDF66\uD83D\uDE0D\uD83D\uDC95, more you being unreal and me being grateful I get to call you MINE \uD83D\uDE24\uD83D\uDC96\uD83D\uDC8D</p>

<p>You’re 1000x more than I deserve and exactly what I prayed for before I even knew what to pray for \uD83D\uDE4F\uD83D\uDC96\uD83D\uDCAB. Like, God heard my dumb teenage prayers and said “bet, let me give him Jolly” \uD83D\uDE2D\uD83D\uDC96✨</p>

<p>So today, my love \uD83D\uDC95, my softie \uD83E\uDD79\uD83D\uDC97, my headache and my peace at the same time \uD83E\uDD2F\uD83D\uDC96\uD83D\uDE02 — I want you to know: I see you, I adore you, I’m obsessed with you (healthy obsessed, not FBI obsessed \uD83D\uDE05\uD83D\uDC98), and I’m never ever ever getting tired of you \uD83D\uDC96\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96</p>

<p>If love was code, you’d be my infinite loop ♾️\uD83D\uDC96 — no break statement, no exit condition, just while(true) { loveYou++ } \uD83D\uDCBB\uD83D\uDC95\uD83D\uDC97\uD83D\uDC97\uD83D\uDC97</p>

<p>Happy Birthday, my Jolly Kamikazi \uD83D\uDC51\uD83D\uDC96\uD83C\uDF82\uD83C\uDF89✨ — may your cake be sweet, your glow be extra, your headaches be few, and your Dalin be forever annoying you with love letters like this one \uD83D\uDE02\uD83D\uDC8B\uD83D\uDC96\uD83D\uDC96\uD83D\uDC96</p>

<p class="text-[20px] md:text-[22px] serif mt-8">Forever Yours, Obsessively, Stupidly, Completely,<br/><a href="#love-letter-full" class="underline decoration-wavy decoration-pink-400 hover:text-[#FF2E93] transition">Dalin Kats \uD83D\uDC8D❤️\uD83E\uDD70\uD83D\uDC8B\uD83D\uDC96\uD83D\uDC95\uD83D\uDC98 — Your #1 Fan, Hoodie Provider, and Professional Jolly Admirer™ \uD83D\uDC8C\uD83D\uDC96✨</a></p>
